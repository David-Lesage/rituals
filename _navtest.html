<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>navtest</title>
<style>html,body{margin:0;background:#222;color:#eee;font:13px monospace}#f{border:0;display:block}</style>
</head><body>
<iframe id="f" src="about:blank" width="390" height="844"></iframe>
<script>
window.loadPage=function(src,w,h){return new Promise(function(res){
  var f=document.getElementById('f');
  f.width=w; f.height=h;
  f.style.width=w+'px'; f.style.height=h+'px';
  f.onload=function(){
    try{
      var d=f.contentDocument, s=d.createElement('style');
      s.textContent='*,*::before,*::after{transition:none!important;animation:none!important}';
      d.head.appendChild(s);
    }catch(e){}
    setTimeout(function(){res(f.contentDocument);},250);
  };
  f.src=src+'?nt='+Date.now();
});};
</script>
</body></html>
